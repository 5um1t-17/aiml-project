<div class="term-field"><label id="loan-term-label" for="loan-term-button">Repayment term <small>Years · arithmetic only, excluded from models</small></label><div class="term-picker" id="loan-term-picker"><input type="hidden" name="loan_term" id="loan-term-value" value="4"><button type="button" class="term-toggle" id="loan-term-button" aria-haspopup="listbox" aria-expanded="false" aria-controls="loan-term-options" aria-labelledby="loan-term-label loan-term-selected"><span id="loan-term-selected">4 years</span><span aria-hidden="true">⌄</span></button><div class="term-options" id="loan-term-options" role="listbox" aria-labelledby="loan-term-label" hidden>{% for years in range(1,21) %}<button type="button" role="option" data-value="{{ years }}" aria-selected="{{ 'true' if years == 4 else 'false' }}" tabindex="-1">{{ years }} {{ 'year' if years == 1 else 'years' }}</button>{% endfor %}{% for years in [25,30,40] %}<button type="button" role="option" data-value="{{ years }}" aria-selected="false" tabindex="-1">{{ years }} years</button>{% endfor %}</div></div></div>
